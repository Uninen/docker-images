name: Build Python 3.14 + Postgis

on:
  pull_request:
    paths:
      - .github/workflows/build-python-postgis-3.14.yml
      - python-postgis-3.14.Dockerfile
      - scripts/cleanup.sh
      - scripts/install-common.sh
      - scripts/install-postgres-client.sh
      - scripts/prep-postgis.sh

concurrency:
  group: build-postgis-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: python-postgis-3.14.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: uninen/python-postgis:3.14
